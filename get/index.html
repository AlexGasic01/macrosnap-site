<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Real browser? Leave immediately for the site. This still works: it's a
     page-load redirect outside any webview, not a click-triggered one.
     ?to=store means they asked for the App Store rather than the site. -->
<script>
  var SITE  = "https://macrosnap.shop/";
  var STORE = "https://apps.apple.com/us/app/macrosnap-ai-calorie-tracker/id6759880124";

  var wantStore = /[?&]to=store/.test(location.search);

  var inApp = /Instagram|FBAN|FBAV|FB_IAB|musical_ly|Bytedance|TikTok/i.test(navigator.userAgent);

  if (!inApp) location.replace(wantStore ? STORE : SITE);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Get MacroSnap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1A1A1A; color: #FFFFFF; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 32px 24px; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mark { width: 66px; height: 66px; border-radius: 23%; display: block; }
  h1 { font-size: 25px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.2; }
  p  { font-size: 14.5px; line-height: 1.6; color: #9A9A9A; max-width: 300px; }
  a  { text-decoration: none; }

  #go {
    display: inline-flex; align-items: center; justify-content: center;
    background: #3DD68C; color: #0F1F17;
    padding: 14px 28px; border-radius: 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
    transition: transform .15s, filter .15s;
  }
  #go:active { transform: scale(.97); filter: brightness(1.06); }

  #store { font-size: 13px; color: #9A9A9A; }
  #store u { text-decoration-color: rgba(255,255,255,.25); text-underline-offset: 3px; }

  #coach {
    display: none;
    max-width: 320px; background: #2E2E2E; border-radius: 12px;
    padding: 13px 16px; font-size: 12.5px; line-height: 1.55; color: #9A9A9A;
  }
  #coach b { color: #FFFFFF; font-weight: 600; }
</style>
</head>
<body>

  <img class="mark" src="../assets/icon.png" alt="" />
  <h1>Get MacroSnap</h1>
  <p>Snap your food, know your macros.</p>

  <!-- Plain anchors, nothing scripted on click. In Instagram's webview,
       *scripted* navigation (location.href / .replace, from a click handler
       or a scheme cascade) is what gets blocked — a real tap on a real
       <a href> is not. That was proven the hard way on the main site: a
       click handler doing preventDefault() + location.replace() looked
       identical to a dead button, while removing it and letting the anchor
       activate natively fixed it. Do not reintroduce a click handler here. -->
  <a id="go" href="https://macrosnap.shop/">Continue to MacroSnap</a>

  <a id="store" href="https://apps.apple.com/us/app/macrosnap-ai-calorie-tracker/id6759880124">
    Or <u>download on the App&nbsp;Store</u>
  </a>

  <div id="coach">
    <span id="appName">This app</span> may block this link. Tap <b>•••</b> at the
    top right, then <b>Open in external browser</b>.
  </div>

<script>
  // Name the actual app doing the blocking — more actionable than a
  // generic warning.
  (function () {
    var ua = navigator.userAgent;
    var name = /Instagram/i.test(ua)                  ? "Instagram"
             : /FBAN|FBAV|FB_IAB/i.test(ua)           ? "Facebook"
             : /musical_ly|Bytedance|TikTok/i.test(ua) ? "TikTok"
             : "This app";
    document.getElementById("appName").textContent = name;
  })();

  // Shown straight away, not gated behind a failed cascade — there's no
  // reliable way to detect from JS whether the tap actually worked, so the
  // fallback instruction is just always available for in-app browsers.
  if (inApp) document.getElementById("coach").style.display = "block";
</script>

</body>
</html>
