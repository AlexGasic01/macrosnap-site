<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Real browser? Leave immediately. This is what makes the escape
     self-completing: when the user picks "Open in external browser",
     Safari reloads THIS page, falls through to the redirect below, and
     lands on the right destination without another tap.
     ?to=store means they asked for the App Store rather than the site. -->
<script>
  var SITE  = "https://macrosnap.shop/";
  var STORE = "https://apps.apple.com/us/app/macrosnap-ai-calorie-tracker/id6759880124";

  var wantStore = /[?&]to=store/.test(location.search);

  var inApp = /Instagram|FBAN|FBAV|FB_IAB|musical_ly|Bytedance|TikTok/i.test(navigator.userAgent);

  if (!inApp) location.replace(wantStore ? STORE : SITE);

  // Escape routes. Chrome reopens this page (which then forwards on its own);
  // the itms schemes hand straight off to the App Store app.
  var CHROME_SITE  = "googlechromes://macrosnap.shop/";
  var CHROME_STORE = "googlechromes://macrosnap.shop/get/?to=store";
  var STORE_SCHEMES = [
    "itms-appss://apps.apple.com/us/app/id6759880124",
    "itms-apps://apps.apple.com/us/app/id6759880124"
  ];

  // Site first, store as the fallback.
  var SITE_CASCADE  = [CHROME_SITE].concat(STORE_SCHEMES);
  // Store first, Chrome bounce as the fallback.
  var STORE_CASCADE = STORE_SCHEMES.concat([CHROME_STORE]);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Get MacroSnap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1A1A1A; color: #FFFFFF; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 32px 24px; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mark { width: 66px; height: 66px; border-radius: 23%; display: block; }
  h1 { font-size: 25px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.2; }
  p  { font-size: 14.5px; line-height: 1.6; color: #9A9A9A; max-width: 300px; }
  a  { text-decoration: none; }

  #go {
    display: inline-flex; align-items: center; justify-content: center;
    background: #3DD68C; color: #0F1F17;
    padding: 14px 28px; border-radius: 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
    transition: transform .15s, filter .15s;
  }
  #go:active { transform: scale(.97); filter: brightness(1.06); }

  #store { font-size: 13px; color: #9A9A9A; }
  #store u { text-decoration-color: rgba(255,255,255,.25); text-underline-offset: 3px; }

  #coach {
    display: none;
    max-width: 320px; background: #2E2E2E; border-radius: 12px;
    padding: 13px 16px; font-size: 12.5px; line-height: 1.55; color: #9A9A9A;
  }
  #coach b { color: #FFFFFF; font-weight: 600; }
</style>
</head>
<body>

  <img class="mark" src="../assets/icon.png" alt="" />
  <h1>Get MacroSnap</h1>
  <p>Snap your food, know your macros.</p>

  <!-- Both are real anchors, so long-press and non-webview taps work
       natively. The scheme cascades only take over inside a webview. -->
  <a id="go" href="https://macrosnap.shop/">Continue to MacroSnap</a>

  <a id="store" href="https://apps.apple.com/us/app/macrosnap-ai-calorie-tracker/id6759880124">
    Or <u>download on the App&nbsp;Store</u>
  </a>

  <div id="coach">
    Instagram blocks this link. Tap <b>•••</b> at the top right, then
    <b>Open in external browser</b>.
  </div>

<script>
  function cascade(list) {
    var i = 0;
    (function step() {
      // Backgrounded means one of the schemes launched something — stop.
      if (document.hidden) return;

      if (i >= list.length) {
        document.getElementById("coach").style.display = "block";
        return;
      }

      location.href = list[i++];
      setTimeout(step, 450);
    })();
  }

  document.getElementById("go").addEventListener("click", function (e) {
    if (!inApp) return;              // real browser: anchor goes to the site
    e.preventDefault();
    cascade(SITE_CASCADE);
  });

  document.getElementById("store").addEventListener("click", function (e) {
    if (!inApp) return;              // real browser: anchor goes to the store
    e.preventDefault();
    // Remember the choice, so escaping via "Open in external browser" reloads
    // this page as ?to=store and forwards to the App Store, not the site.
    try { history.replaceState(null, "", "?to=store"); } catch (err) {}
    cascade(STORE_CASCADE);
  });
</script>

</body>
</html>
